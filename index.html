<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/nori-mark.svg" />
    <meta name="theme-color" content="#f8f7f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e120f" media="(prefers-color-scheme: dark)" />

    <title>Norrin — Enterprise AI is won in production</title>
    <meta
      name="description"
      content="Norrin is the Nordic partner for enabling enterprise AI, turning AI ambition into production through co-created solutions, infrastructure and adoption. A speculative redesign concept."
    />
    <meta name="robots" content="noindex" />

    <!-- The face that renders the headline. Preloading removes the swap flash
         on the one piece of type the whole page is built around. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/schibsted-grotesk-latin-wght-normal.woff2"
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Norrin — Enterprise AI is won in production" />
    <meta
      property="og:description"
      content="A speculative, independent redesign of norrin.com, built from publicly available information."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
