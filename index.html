<!doctype html>
<!-- Dark is the default, so it is in the MARKUP, not applied by script.
     A stored "light" is an upgrade applied below, before first paint. Doing it
     the other way round — ship neutral, let JS pick — is what produces the
     white flash every dark-first site is known for, and it would also leave a
     JS-less visitor on whatever the OS happened to prefer. -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Norrin's own favicon, byte for byte, from
         norrin.com/hubfs/theme-2025/favicon/norrin-favicon.svg. It replaced the
         Nori mascot mark, the last piece of Nori left after the mascot was deleted. -->
    <link rel="icon" type="image/svg+xml" href="/norrin-mark.svg" />
    <!-- One tag, not two media-scoped ones. The theme is no longer the OS
         preference, so scoping the browser chrome to `prefers-color-scheme`
         painted a paper-coloured address bar above a black page for anyone on a
         light OS. useTheme rewrites this to match whichever theme is showing. -->
    <meta name="theme-color" content="#0e120f" />

    <!-- Blocking on purpose, and first: it runs before the body paints, so a
         returning light-mode reader never sees the dark default flash past.
         Wrapped because Safari throws on localStorage in a blocked-cookies
         context; the catch leaves the markup's dark in place. -->
    <script>
      try {
        if (localStorage.getItem('norrin-theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').content = '#f8f7f3'
        }
      } catch {}
    </script>

    <title>Norrin — Enterprise AI is won in production</title>
    <meta
      name="description"
      content="Norrin is the Nordic partner for enabling enterprise AI, turning AI ambition into production through co-created solutions, infrastructure and adoption. A speculative redesign concept."
    />
    <meta name="robots" content="noindex" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Norrin — Enterprise AI is won in production" />
    <meta
      property="og:description"
      content="A speculative, independent redesign of norrin.com, built from publicly available information."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
