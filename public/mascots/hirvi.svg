             Z" fill="var(--c-body)" stroke="var(--c-line)" stroke-width="1.9"></path><g fill="var(--c-body)" stroke="var(--c-line)" stroke-width="1.5"><path d="M42 70 L42 87 C42 89.4 48 89.4 48 87 L48 70 Z"></path><path d="M65 70 L65 87 C65 89.4 71 89.4 71 87 L71 70 Z"></path></g><g fill="var(--c-moss)" stroke="var(--c-line)" stroke-width="1.2"><rect x="41.4" y="86" width="7.2" height="4.4" rx="1.4"></rect><rect x="64.4" y="86" width="7.2" height="4.4" rx="1.4"></rect></g><path d="M55 43.4 C63 43.6 71 45.4 75.5 47.6 L72 61 C65.5 58.6 59 57.6 53.6 57.6 Z" fill="var(--c-moss)" stroke="var(--c-line)" stroke-width="1.4" opacity="0.95"></path><path class="chHirvi__ear" d="M37 32 C41.4 30.6 45.6 30.8 46.6 32.8 C47.6 34.8 43.8 37.8 39.6 38.4 C37.2 38.8 36.2 35.2 37 32 Z" fill="var(--c-body)" stroke="var(--c-line)" stroke-width="1.4"></path><ellipse cx="18.8" cy="47.2" rx="4.6" ry="2.7" fill="var(--c-paper)" stroke="var(--c-line)" stroke-width="1.15" opacity="0.62"></ellipse><ellipse cx="17" cy="46.6" rx="1.2" ry="0.85" fill="var(--c-line)" opacity="0.7"></ellipse><g class="chHirvi__eyes"><circle cx="27.5" cy="40.4" r="2.7" fill="var(--c-paper)"></circle><circle cx="27.8" cy="40.6" r="1.75" fill="var(--c-line)"></circle><circle cx="28.5" cy="39.8" r="0.62" fill="var(--c-paper)"></circle></g><g fill="var(--c-body)" stroke="var(--c-line)" stroke-width="1.5"><path d="M33 31 C26 29.4 19.4 26.6 16 22.6 C14.6 21 16 19 18.4 19.4 L36.6 22 C37 26 35.4 29 33 31.2 Z"></path><path d="M38 29.4 C45 27.6 51.6 24.8 55 21.2 C56.4 19.6 55 17.6 52.6 18 L37.4 20.6 C36.6 24.2 36.6 27.4 38 29.4 Z"></path></g><g stroke="var(--c-line)" stroke-width="1.6" opacity="0.9"><path d="M18.6 20 L17 16"></path><path d="M24 21.4 L23.4 16.4"></path><path d="M29.6 22.6 L29.6 17"></path><path d="M45 20.6 L45.6 16.4"></path><path d="M50.6 19.4 L52 16"></path></g><g><rect x="14" y="10" width="48" height="6" rx="1.2" fill="var(--c-moss)" stroke="var(--c-line)" stroke-width="1.5"></rect><g fill="var(--c-body)" str