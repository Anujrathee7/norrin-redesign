<!-- Norrin mascot: revontuli-mark. Generated by tools/mascots.mjs — do not edit by hand.
     Self-contained: palette and keyframes inlined, animation included,
     honours prefers-color-scheme. Source: .chRevo[data-form="mark"] -->
<svg class="chRevo " viewBox="0 0 100 100" fill="none" data-form="mark" role="presentation" focusable="false" xmlns="http://www.w3.org/2000/svg" width="512" height="512">
<style>
/* ==========================================================================
   NORRIN CHARACTER SET — the drawn mascots
   --------------------------------------------------------------------------
   A deliberate break from Fyr-the-instrument. Fyr is a diagram and its own
   docblock forbids a face; these are characters and are allowed one. Both
   survive: the instrument still carries the argument in TheGap, the cast
   carries the warmth.

   THE DRAWN LOOK is four rules, applied identically to every character so the
   set reads as one hand:

     1. One contour weight (1.9) outside, one interior weight (1.15). Two
        weights is what separates "drawn" from "traced" — a single uniform
        stroke reads as clip-art.
     2. Every cap and join is round. Nothing drawn by hand has a mitre on it.
     3. The BOIL. Hand-drawn animation shimmers because each frame is redrawn
        by a person who cannot land the same line twice. Three sub-pixel
        transforms on steps(1) reproduces it, and it is the single biggest
        reason these read as animation cels rather than as vectors.
     4. Flat fill plus one darker shade. No gradients except a lamp.

   PALETTE — self-contained on purpose. The body is forest in BOTH themes
   (--inverse is #123e28 / #16452c), so a fixed dark contour works on it
   everywhere and the characters never need theme-keyed internals. Faces are
   fixed paper, never --ground: keyed to the theme they turn black in dark
   mode, and a dark face with white eyes reads haunted. That was learned once
   already on Lunni and is not being relearned here.

   Only the OUTER rim is theme-aware, because a forest silhouette on the dark
   ground would otherwise lose its edge entirely.

   MOTION CONTRACT, inherited from Fyr and unchanged:
     - transform and opacity only. No filters, no JS in the motion path.
     - Nothing a character MEANS depends on movement.
     - data-static kills it; prefers-reduced-motion resolves to the RESTING
       frame, never a mid-blink one.
   ========================================================================== */

.ch {
  display: block;
  overflow: visible;

  /* NOT var(--inverse), which is what this was and which was wrong in a way
     only a screenshot caught: on a [data-tone='inverse'] band the body was
     then the EXACT colour of the band behind it, so every character lost its
     silhouette and read as a face floating on nothing. The body needs its own
     value in the forest family that is never equal to any ground it sits on. */
  --c-body: light-dark(#153f2a, #2a6146);
  --c-line: #0b2418;
  --c-rim: light-dark(#0b2418, #8fae9a);
  --c-paper: #eef0e6;
  --c-shade: #0d3220;
  --c-sun: var(--signal);
  --c-moss: light-dark(#504e18, #9fb87e);
}

/* On the forest bands the body lifts clear of the band and the contour has to
   stop being darker-than-dark, since a #0b2418 line on a #123e28 ground is a
   hairline nobody can see. Same move the site already makes with its inverse
   ink ramp — the character is not repainted, it is re-rung. */
[data-tone='inverse'] .ch {
  --c-body: #2f6b4c;
  --c-line: #0a2317;
  --c-rim: #8fae9a;
  --c-shade: #1d4d35;
}

.ch [stroke] {
  stroke-linecap: round;
  stroke-linejoin: round;
}

.ch[data-facing='left'] {
  transform: scaleX(-1);
}

/* --------------------------------------------------------------------------
   THE BOIL
   Three frames on steps(1) at ~7fps — the rate a 2s-on-3s cel sequence really
   runs at. Displacement is deliberately sub-pixel at display size: the eye
   reads it as the line being alive, not as the drawing moving. Any larger and
   it becomes a vibration, which is a different and much worse effect.
   -------------------------------------------------------------------------- */
@keyframes ch-boil {
  0%,
  33.32% {
    transform: translate(0, 0) rotate(0deg);
  }
  33.33%,
  66.65% {
    transform: translate(0.22px, -0.18px) rotate(0.16deg);
  }
  66.66%,
  100% {
    transform: translate(-0.19px, 0.2px) rotate(-0.13deg);
  }
}

.ch__boil {
  transform-origin: 50px 60px;
  animation: ch-boil 0.42s steps(1, end) infinite;
}

/* Blink. Held shut for a fraction of the cycle: a slow scaleY is a sleepy
   character, a fast one is a nervous one. Every character runs a different
   period so a gallery of them never blinks in chorus — the single tell that
   turns a cast into a set of copies. */
@keyframes ch-blink {
  0%,
  95.4% {
    transform: scaleY(1);
  }
  95.5%,
  97.6% {
    transform: scaleY(0.1);
  }
  97.7%,
  100% {
    transform: scaleY(1);
  }
}

/* ---------------------------------------------- FYR — the keeper ---------- */
.chFyr__bob {
  transform-origin: 50px 84px;
  animation: chFyr-bob 4.6s cubic-bezier(0.37, 0, 0.63, 1) infinite;
}

/* A buoy heaves and rolls out of phase — the roll lags the lift, because the
   water gets there first and the mass follows. Locking them makes a bouncing
   toy; offsetting them makes something floating. */
@keyframes chFyr-bob {
  0%,
  100% {
    transform: translateY(0) rotate(-3.4deg);
  }
  35% {
    transform: translateY(-2.6px) rotate(0.6deg);
  }
  70% {
    transform: translateY(-0.7px) rotate(3.4deg);
  }
}

.chFyr__eyes {
  transform-origin: 50px 52px;
  animation: ch-blink 6.1s steps(1, end) infinite;
}

.chFyr__flash {
  animation: chFyr-flash 5s linear infinite;
}

/* A sea light is a rhythm, not a pulse: a real one is dark far longer than it
   is lit. Two quick flashes then a long hold reads as a mark on station. */
@keyframes chFyr-flash {
  0%,
  6% {
    opacity: 1;
  }
  13% {
    opacity: 0.42;
  }
  20% {
    opacity: 1;
  }
  30%,
  100% {
    opacity: 0.62;
  }
}

.chFyr__wave {
  animation: chFyr-drift 9s linear infinite;
}

@keyframes chFyr-drift {
  to {
    transform: translateX(-28px);
  }
}

/* ---------------------------------------------- LUNNI — the shipper ------- */
.chLunni__bob {
  transform-origin: 50px 88px;
  animation: chLunni-hop 5.2s cubic-bezier(0.45, 0, 0.55, 1) infinite;
}

/* Weight shift, not a bounce. Birds this shape rock over their feet. */
@keyframes chLunni-hop {
  0%,
  100% {
    transform: translateY(0) rotate(-1.4deg);
  }
  50% {
    transform: translateY(-1.5px) rotate(1.4deg);
  }
}

.chLunni__eyes {
  transform-origin: 56px 45px;
  animation: ch-blink 5.3s steps(1, end) infinite;
}

/* The wing lifts on the same period as the body but peaks late, so it trails
   the shoulder instead of moving with it. */
.chLunni__wing {
  transform-origin: 40px 58px;
  animation: chLunni-wing 5.2s cubic-bezier(0.45, 0, 0.55, 1) infinite;
}

@keyframes chLunni-wing {
  0%,
  100% {
    transform: rotate(0deg);
  }
  60% {
    transform: rotate(-7deg);
  }
}

/* ---------------------------------------------- HIRVI — the foundation ---- */
/* The elk does not bob. That is the entire point of the elk: it is the thing
   that does not move while everything else stands on it. Only the ear flicks
   and the service lights in the antlers cycle. */
.chHirvi__ear {
  transform-origin: 34px 30px;
  animation: chHirvi-ear 6.8s ease-in-out infinite;
}

@keyframes chHirvi-ear {
  0%,
  88%,
  100% {
    transform: rotate(0deg);
  }
  91% {
    transform: rotate(-13deg);
  }
  94% {
    transform: rotate(5deg);
  }
}

.chHirvi__eyes {
  transform-origin: 31px 42px;
  animation: ch-blink 7.7s steps(1, end) infinite;
}

/* Three lights, staggered — a rack that is serving, not a string of fairy
   lights. Each holds full for most of its cycle and dips briefly. */
.chHirvi__svc {
  animation: chHirvi-svc 2.4s ease-in-out infinite;
}

.chHirvi__svc--b {
  animation-delay: 0.8s;
}

.chHirvi__svc--c {
  animation-delay: 1.6s;
}

@keyframes chHirvi-svc {
  0%,
  70%,
  100% {
    opacity: 1;
  }
  85% {
    opacity: 0.3;
  }
}

/* ---------------------------------------------- VALO — the watch ---------- */
.chValo__breathe {
  transform-origin: 50px 86px;
  animation: chValo-breathe 5.9s ease-in-out infinite;
}

@keyframes chValo-breathe {
  0%,
  100% {
    transform: translateY(0) scaleY(1);
  }
  50% {
    transform: translateY(-0.9px) scaleY(1.012);
  }
}

.chValo__eyes {
  transform-origin: 50px 46px;
  animation: ch-blink 4.9s steps(1, end) infinite;
}

/* The lantern swings from the fist, so its pivot is the hand and not its own
   centre — and it swings slower than the body breathes, because it is heavy. */
.chValo__lantern {
  /* The fist, not the lantern's own centre — it hangs from the hand. */
  transform-origin: 75.4px 56.6px;
  animation: chValo-swing 7.4s ease-in-out infinite;
}

@keyframes chValo-swing {
  0%,
  100% {
    transform: rotate(-3.6deg);
  }
  50% {
    transform: rotate(3.6deg);
  }
}

.chValo__flame {
  transform-origin: 75px 71px;
  animation: chValo-flame 2.1s ease-in-out infinite;
}

@keyframes chValo-flame {
  0%,
  100% {
    transform: scale(1);
    opacity: 1;
  }
  50% {
    transform: scale(1.07);
    opacity: 0.82;
  }
}

/* ---------------------------------------------- switches ------------------ */
.ch[data-static='true'] .ch__boil,
.ch[data-static='true'] .chFyr__bob,
.ch[data-static='true'] .chFyr__eyes,
.ch[data-static='true'] .chFyr__flash,
.ch[data-static='true'] .chFyr__wave,
.ch[data-static='true'] .chLunni__bob,
.ch[data-static='true'] .chLunni__eyes,
.ch[data-static='true'] .chLunni__wing,
.ch[data-static='true'] .chHirvi__ear,
.ch[data-static='true'] .chHirvi__eyes,
.ch[data-static='true'] .chHirvi__svc,
.ch[data-static='true'] .chValo__breathe,
.ch[data-static='true'] .chValo__eyes,
.ch[data-static='true'] .chValo__lantern,
.ch[data-static='true'] .chValo__flame {
  animation: none;
}

@media (prefers-reduced-motion: reduce) {
  .ch__boil,
  .chFyr__bob,
  .chFyr__eyes,
  .chFyr__flash,
  .chFyr__wave,
  .chLunni__bob,
  .chLunni__eyes,
  .chLunni__wing,
  .chHirvi__ear,
  .chHirvi__eyes,
  .chHirvi__svc,
  .chValo__breathe,
  .chValo__eyes,
  .chValo__lantern,
  .chValo__flame {
    animation: none !important;
    transform: none !important;
  }
}
/* ==========================================================================
   REVONTULI — the naali
   --------------------------------------------------------------------------
   THE TWO COATS.

   The arctic fox has a dark summer coat and a white winter coat, and that
   fact does real work here. The last mascot set shipped a bug where the body
   was the same colour as the band behind it, so every character lost its
   silhouette on an inverse ground. The coat swap fixes that class of bug
   permanently, and fixes it with something biologically true rather than an
   arbitrary token flip:

     paper ground   -> SUMMER coat (dark), so it holds against light
     dark ground    -> WINTER coat (pale), so it holds against near-black
     forest band    -> WINTER coat (pale), so it holds against forest

   The face patch is fixed paper in BOTH coats. In summer it reads as the
   mask a real naali has; in winter it disappears into the coat and only the
   eyes remain. Either way the eyes are dark on pale and always legible —
   which is the whole reason the patch is there, and why it is never keyed to
   the theme. A dark face with pale eyes reads haunted; that was learned on
   Lunni and is not being relearned.

   NO ORANGE ANYWHERE. Norrin's full brand CSS does contain `sand` (#ca8b50)
   and `bark` (#75562d), and both are forbidden on this drawing: warm brown on
   a fox is the single fastest route back to looking like Mozilla Firefox,
   whose name and logo come from the same myth. Escaping that is the design
   problem, and colour is the biggest lever we have.
   ========================================================================== */

.chRevo {
  display: block;
  overflow: visible;

  /* Summer coat — the default, for the paper ground. */
  --r-coat: #1f5238;
  --r-line: #0b2418;
  --r-shade: #163d29;
  --r-face: #eef0e6;
  --r-ear: light-dark(#504e18, #9fb87e);
  --r-eye: #14170f;
  --r-sun: var(--signal);
  --r-lichen: #88967e;
}

/* Winter coat. The ground went dark, so the fox turned white. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) .chRevo {
    --r-coat: #eef0e6;
    --r-line: #123e28;
    --r-shade: #c6d0bd;
    --r-face: #ffffff;
    --r-eye: #14170f;
  }
}

:root[data-theme='dark'] .chRevo {
  --r-coat: #eef0e6;
  --r-line: #123e28;
  --r-shade: #c6d0bd;
  --r-face: #ffffff;
}

/* On a forest band the fox is in winter coat regardless of theme — the band
   is dark in both. This has to come after the theme blocks to win. */
[data-tone='inverse'] .chRevo {
  --r-coat: #eef0e6;
  --r-line: #123e28;
  --r-shade: #c6d0bd;
  --r-face: #ffffff;
  --r-ear: #504e18;
}

.chRevo [stroke] {
  stroke-linecap: round;
  stroke-linejoin: round;
}

.chRevo[data-facing='left'] {
  transform: scaleX(-1);
}

/* --------------------------------------------------------------------------
   MOTION. Same contract as every other mascot here: transform and opacity
   only, no filters, no JS in the motion path, and nothing the drawing MEANS
   depends on movement.
   -------------------------------------------------------------------------- */

/* Breathe. Smaller than the other characters' idles — this one is composed,
   not bouncy, which is the register that was asked for. */
.chRevo__breathe {
  transform-origin: 50px 78px;
  animation: revo-breathe 6.4s ease-in-out infinite;
}

@keyframes revo-breathe {
  0%,
  100% {
    transform: translateY(0) scaleY(1);
  }
  50% {
    transform: translateY(-0.7px) scaleY(1.008);
  }
}

.chRevo__eyes {
  transform-origin: 50px 44px;
  animation: revo-blink 6.9s steps(1, end) infinite;
}

@keyframes revo-blink {
  0%,
  95.6% {
    transform: scaleY(1);
  }
  95.7%,
  97.7% {
    transform: scaleY(0.08);
  }
  97.8%,
  100% {
    transform: scaleY(1);
  }
}

/* Ear flick. Foxes track sound constantly; one ear moving alone is the tell
   that reads as alive, and moving both together reads as a puppet. */
.chRevo__ear {
  animation: revo-ear 7.6s ease-in-out infinite;
}

@keyframes revo-ear {
  0%,
  86%,
  100% {
    transform: rotate(0deg);
  }
  89% {
    transform: rotate(-11deg);
  }
  92% {
    transform: rotate(4deg);
  }
}

/* The tail sweep. This is the one animation that carries meaning, so it is
   deliberately slow: the tail is DRAWING the line, and a fast sweep would
   read as wagging. */
.chRevo__tail {
  transform-origin: 32px 50px;
  animation: revo-tail 8.2s ease-in-out infinite;
}

@keyframes revo-tail {
  0%,
  100% {
    transform: rotate(-2.4deg);
  }
  50% {
    transform: rotate(2.4deg);
  }
}

/* The aurora. A slow travelling shimmer, not a pulse — the northern lights
   move along themselves rather than flashing on and off. */
.chRevo__aurora {
  animation: revo-aurora 5.4s ease-in-out infinite;
}

@keyframes revo-aurora {
  0%,
  100% {
    opacity: 0.9;
  }
  50% {
    opacity: 0.55;
  }
}

.chRevo__aurora--b {
  animation-delay: 1.8s;
}

/* --------------------------------------------------------------------------
   Switches.
   -------------------------------------------------------------------------- */
.chRevo[data-static='true'] .chRevo__breathe,
.chRevo[data-static='true'] .chRevo__eyes,
.chRevo[data-static='true'] .chRevo__ear,
.chRevo[data-static='true'] .chRevo__tail,
.chRevo[data-static='true'] .chRevo__aurora {
  animation: none;
}

/* Reduced motion resolves to the RESTING frame, never a mid-blink one. */
@media (prefers-reduced-motion: reduce) {
  .chRevo__breathe,
  .chRevo__eyes,
  .chRevo__ear,
  .chRevo__tail,
  .chRevo__aurora {
    animation: none !important;
    transform: none !important;
  }
}


/* Palette resolved off the live page. Written at svg.ch so it outranks
   the .ch defaults above, which reference tokens a bare file lacks. */
  svg.ch, svg.chRevo {
    --c-body: #153f2a;
    --c-line: #0b2418;
    --c-rim: #0b2418;
    --c-paper: #eef0e6;
    --c-shade: #0d3220;
    --c-sun: #f6f279;
    --c-moss: #504e18;
    --r-coat: #1f5238;
    --r-line: #0b2418;
    --r-shade: #163d29;
    --r-face: #eef0e6;
    --r-ear: #504e18;
    --r-eye: #14170f;
    --r-sun: #f6f279;
    --r-lichen: #88967e;
  }
  @media (prefers-color-scheme: dark) {
    svg.ch, svg.chRevo {
    --c-body: #2a6146;
    --c-line: #0b2418;
    --c-rim: #8fae9a;
    --c-paper: #eef0e6;
    --c-shade: #0d3220;
    --c-sun: #f6f279;
    --c-moss: #9fb87e;
    --r-coat: #eef0e6;
    --r-line: #123e28;
    --r-shade: #c6d0bd;
    --r-face: #fff;
    --r-ear: #9fb87e;
    --r-eye: #14170f;
    --r-sun: #f6f279;
    --r-lichen: #88967e;
    }
  }
</style>
<g class="chRevo__breathe"><g class="chRevo__aurora" fill="none" stroke-linecap="round"><path d="M17 26 C22 10 36 3 50 3 C64 3 78 10 83 26" stroke="var(--r-sun)" stroke-width="2.8" opacity="0.85"></path><path d="M12 30 C18 11 34 8.4 50 8.4" stroke="var(--r-lichen)" stroke-width="1.8" opacity="0.5" class="chRevo__aurora--b"></path></g><g class="chRevo__ear" style="transform-origin: 33px 33px;"><path d="M29 33 C24.6 23 23.6 13.6 26.4 11.6 C29.4 9.6 36 14.6 40.4 21.6 C42.6 25.2 43.6 28.2 44 30.4 Z" fill="var(--r-coat)" stroke="var(--r-line)" stroke-width="1.9"></path><path d="M30.8 30 C28 23.4 27.4 17.4 29.2 16.2 C31 15.2 35 19.2 38.2 24.4 C39.8 27 40.6 28.8 41 30 Z" fill="var(--r-ear)"></path></g><g class="chRevo__ear" style="transform-origin: 67px 33px; animation-delay: 2.9s;"><path d="M71 33 C75.4 23 76.4 13.6 73.6 11.6 C70.6 9.6 64 14.6 59.6 21.6 C57.4 25.2 56.4 28.2 56 30.4 Z" fill="var(--r-coat)" stroke="var(--r-line)" stroke-width="1.9"></path><path d="M69.2 30 C72 23.4 72.6 17.4 70.8 16.2 C69 15.2 65 19.2 61.8 24.4 C60.2 27 59.4 28.8 59 30 Z" fill="var(--r-ear)"></path></g><path d="M50 21 C64 21 74.5 28 77.5 40
